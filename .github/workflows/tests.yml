# The tests, somewhere that runs them.
#
# Until this file existed there was no CI at all: `python tests/run.py` was
# something a contributor remembered to do, the browser suite was not in that
# script's list, and a run in an environment missing Gradio or Pillow skipped
# two thirds of itself and still exited 0. "All tests pass" meant less than it
# looked like it meant, which is how a Canvas that never attached shipped
# behind a green suite.
#
# So: every suite, on every push, with the browser one included and skips
# treated as failures.
name: tests

# A branch with a pull request is covered by ``pull_request``; main is covered
# by ``push``. Running both on every branch ran the whole suite twice for one
# commit - two browser installs, two of everything - for one answer. A branch
# with no pull request yet can be checked from the Actions tab
# (``workflow_dispatch``).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per pull request (or per branch, on main), and a new push stands the
# previous one down rather than queueing behind it.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Gradio probes its own local URL through httpx on launch, which follows
      # the proxy environment; excluding loopback keeps that honest on any
      # runner that sets one. One spelling only - GitHub treats env keys as
      # case-insensitive and rejects the whole file for a duplicate, and
      # Python's proxy handling reads this one regardless of case.
      NO_PROXY: "127.0.0.1,localhost,::1"
      # Every suite in SUITES must actually run. A skip is a broken
      # environment, and a broken environment that reports success is the
      # thing this workflow exists to prevent.
      MINIPAINT_REQUIRE_ALL_SUITES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Install Chromium for the browser suite
        run: python -m playwright install --with-deps chromium

      - name: Run every suite
        run: python tests/run.py

  # The editor's own suite needs a Forge Neo checkout for the real
  # ForgeCanvas, which this workflow has no way to provide. It is not run
  # here; it is run by hand against a real install. Said out loud rather than
  # left for somebody to discover, because a suite nobody knows is unrun is
  # the same problem in a different place.
  #
  #   FORGE_ROOT=/path/to/forge-neo python tests/browser_smoke.py
